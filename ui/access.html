<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羽毛笔 La Pluma · 输入访问码</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{--bg:#f2f1ee;--card:#fff;--line:#e4e2dd;--ink:#171714;--sub:#6c6a63;--faint:#97948c;--red:#C8202C;--ok:#2f7d4f}
  @media (prefers-color-scheme:dark){
    :root{--bg:#111110;--card:#1c1c1a;--line:#2e2e2b;--ink:#e9e7e2;--sub:#9c9992;--faint:#6f6c66;--red:#e2565c;--ok:#57b87c}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 30px;width:min(430px,100%);
        text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05),0 18px 46px rgba(0,0,0,.10)}
  .lg{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:.04em}
  .lg em{font-style:italic;font-weight:400;color:var(--faint);font-family:Georgia,serif;font-size:14px}
  .addr{font-family:Consolas,monospace;font-size:11.5px;color:var(--faint);margin:9px 0 22px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
  .ask{font-size:12.5px;color:var(--sub);margin-bottom:14px}
  .digits{display:flex;gap:7px;justify-content:center;margin-bottom:16px}
  .digits input{width:38px;height:48px;text-align:center;font-size:18px;font-family:Consolas,monospace;
     border:1.4px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;outline:none;transition:.16s}
  .digits input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(128,128,128,.14)}
  .digits.bad input{border-color:var(--red);animation:shake .3s ease}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  button{font:inherit;width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
     border-radius:10px;padding:11px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.16s}
  button:hover{opacity:.87}
  button:disabled{opacity:.4;cursor:not-allowed}
  .fine{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:15px}
  .msg{margin-top:14px;font-size:12.5px;min-height:18px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="card">
  <div class="lg">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 20c6-1 9-4 11-9 1.4-3.4 2-6 2-7-2 0-5 .5-8 2C5 8 3.6 12.4 4 20z"/><path d="M4 20c2-4 5-6 9-8"/></svg>
    羽毛笔 <em>La Pluma</em>
  </div>
  <div class="addr"><i class="dot"></i><span id="host">—</span> · 主机在线</div>
  <div class="ask">请输入电脑屏幕上显示的访问码</div>
  <div class="digits" id="digits">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
  </div>
  <button id="go">进入</button>
  <div class="msg" id="msg"></div>
  <div class="fine">访问码在电脑上启动时打印，只给对一次（12 小时有效）；<br>电脑关机或关掉那个窗口，这里就打不开了。</div>
</div>
<script>
const $ = s => document.querySelector(s);
$('#host').textContent = location.host || '127.0.0.1:8765';
const boxes = [...document.querySelectorAll('#digits input')];
boxes.forEach((b, i) => {
  b.addEventListener('input', () => {
    b.value = b.value.replace(/\D/g, '').slice(0, 1);
    if (b.value && i < 7) boxes[i + 1].focus();
    if (boxes.every(x => x.value)) submit();
  });
  b.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !b.value && i > 0) boxes[i - 1].focus();
    if (e.key === 'Enter') submit();
  });
});
$('#go').onclick = submit;
let busy = false;
async function submit() {
  if (busy) return;
  const code = boxes.map(b => b.value).join('');
  if (code.length < 8) { $('#msg').className = 'msg err'; $('#msg').textContent = '还差 ' + (8 - code.length) + ' 位'; return; }
  busy = true; $('#go').disabled = true;
  try {
    const r = await fetch('/api/access', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    const j = await r.json();
    if (j.ok) {
      $('#msg').className = 'msg ok'; $('#msg').textContent = '✓ 对了，正在进入…';
      location.replace('/');
      return;
    }
    $('#digits').classList.add('bad');
    $('#msg').className = 'msg err'; $('#msg').textContent = j.error || '访问码不对';
    setTimeout(() => { $('#digits').classList.remove('bad'); boxes.forEach(b => b.value = ''); boxes[0].focus(); }, 340);
  } catch (e) {
    $('#msg').className = 'msg err'; $('#msg').textContent = '连不上主机：' + e;
  }
  busy = false; $('#go').disabled = false;
}
boxes[0].focus();
</script>
</body>
</html>
